# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: creditedge
type: application
framework:
  name: SAPUI5
  version: 1.120.39
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://sandbox-app.alkemerp.com:8001
            client: '900'
            destination: S4HANA_DEV
          - path: /sap/opu/odata/sap/ZUI_CE_APPR_MATRIX_SB/
            url: http://sandbox-app.alkemerp.com:8001
            client: '900'
            destination: S4HANA_DEV
          - path: /sap/opu/odata/sap/API_SLS_DOC_WITH_CREDIT_BLOCK/
            url: http://sandbox-app.alkemerp.com:8001
            client: '900'
            destination: S4HANA_DEV
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZC_CE_ORDERSONHOLD_CDS
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZUI_CE_APPR_MATRIX_SB
            metadataPath: ./webapp/localService/ZUI_CE_APPR_MATRIX_SB/metadata.xml
            mockdataPath: ./webapp/localService/ZUI_CE_APPR_MATRIX_SB/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/API_SLS_DOC_WITH_CREDIT_BLOCK
            metadataPath: ./webapp/localService/API_SLS_DOC_WITH_CREDIT_BLOCK/metadata.xml
            mockdataPath: ./webapp/localService/API_SLS_DOC_WITH_CREDIT_BLOCK/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZC_CE_ORDERSONHOLD_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZC_CE_ORDERSONHOLD_CDS_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/ZUI_CE_APPR_MATRIX_SB/ZUI_CE_APPR_MATRIX_SB_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZUI_CE_APPR_MATRIX_SB_VAN',Version='0001')/$value/
          - localPath: ./webapp/localService/API_SLS_DOC_WITH_CREDIT_BLOCK/API_SLS_DOC_WITH_CREDIT_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='API_SLS_DOC_WITH_CREDIT_ANNO_MDL',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
